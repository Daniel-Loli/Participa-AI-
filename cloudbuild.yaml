steps:
  # ── Build y push: Scraper ─────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/scraper:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/scraper:latest
      - ./data-pipeline/scraper
    id: build-scraper

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/scraper
    id: push-scraper
    waitFor: [build-scraper]

  # ── Build y push: AI Agent ────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/ai-agent:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/ai-agent:latest
      - ./services/ai-agent
    id: build-ai-agent

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/ai-agent
    id: push-ai-agent
    waitFor: [build-ai-agent]

  # ── Build y push: WhatsApp ─────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/whatsapp:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/whatsapp:latest
      - ./services/whatsapp
    id: build-whatsapp

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/whatsapp
    id: push-whatsapp
    waitFor: [build-whatsapp]

  # ── Deploy: AI Agent ───────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - participa-ai-agent
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/ai-agent:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8000
      - --memory=1Gi
      - --set-env-vars=OPENAI_MODEL=gpt-4o-mini,OPENAI_EMBEDDING_MODEL=text-embedding-3-small,OPENAI_WHISPER_MODEL=whisper-1,OPENAI_TTS_MODEL=tts-1,OPENAI_TTS_VOICE=alloy,QDRANT_COLLECTION_LEGAL=legal,QDRANT_COLLECTION_ODS=ods,QDRANT_COLLECTION_PROCEDIMIENTOS=procedimientos,QDRANT_COLLECTION_CASOS=casos_exito,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=participa-ai
      - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,QDRANT_URL=QDRANT_URL:latest,QDRANT_API_KEY=QDRANT_API_KEY:latest,REDIS_URL=REDIS_URL:latest,REDIS_PASSWORD=REDIS_PASSWORD:latest,LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest
    id: deploy-ai-agent
    waitFor: [push-ai-agent]

  # ── Pre-limpieza: elimina AI_AGENT_SERVICE_URL como secret (no-fatal si el servicio no existe aún)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services update participa-whatsapp \
          --region=us-central1 \
          --remove-secrets=AI_AGENT_SERVICE_URL || true
    id: remove-secret-whatsapp
    waitFor: [push-whatsapp, deploy-ai-agent]

  # ── Deploy: WhatsApp ───────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - participa-whatsapp
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/whatsapp:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --memory=512Mi
      - --set-env-vars=NODE_ENV=production,AI_AGENT_SERVICE_URL=https://participa-ai-agent-87805706219.us-central1.run.app,SESSION_WARNING_MINUTES=4,SESSION_CLOSE_MINUTES=5
      - --set-secrets=WHATSAPP_VERIFY_TOKEN=WHATSAPP_VERIFY_TOKEN:latest,WHATSAPP_ACCESS_TOKEN=WHATSAPP_ACCESS_TOKEN:latest,WHATSAPP_PHONE_NUMBER_ID=WHATSAPP_PHONE_NUMBER_ID:latest,WHATSAPP_APP_SECRET=WHATSAPP_APP_SECRET:latest,REDIS_URL=REDIS_URL:latest,REDIS_PASSWORD=REDIS_PASSWORD:latest
    id: deploy-whatsapp
    waitFor: [remove-secret-whatsapp]

  # ── Deploy: Scraper (Cloud Run Job) ───────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - jobs
      - deploy
      - participa-scraper
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/scraper:$COMMIT_SHA
      - --region=us-central1
      - --max-retries=1
      - --task-timeout=600
      - --memory=512Mi
      - --set-env-vars=OPENAI_EMBEDDING_MODEL=text-embedding-3-small
      - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,QDRANT_URL=QDRANT_URL:latest,QDRANT_API_KEY=QDRANT_API_KEY:latest
    id: deploy-scraper
    waitFor: [push-scraper]

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/scraper:$COMMIT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/scraper:latest
  - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/ai-agent:$COMMIT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/ai-agent:latest
  - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/whatsapp:$COMMIT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/participa-ai/whatsapp:latest

options:
  logging: CLOUD_LOGGING_ONLY
