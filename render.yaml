services:

  # ── 1. WhatsApp Webhook — Node.js / NestJS ─────────────────────────────────
  - type: web
    name: participa-whatsapp
    runtime: docker
    dockerfilePath: ./services/whatsapp/Dockerfile
    dockerContext: ./services/whatsapp
    plan: starter          # always-on — Meta requiere webhook disponible 24/7
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # URL interna del ai-agent (completar tras primer deploy del ai-agent)
      - key: AI_AGENT_SERVICE_URL
        sync: false
      # WhatsApp Business API
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

  # ── 2. AI Agent — Python / FastAPI ────────────────────────────────────────
  - type: web
    name: participa-ai-agent
    runtime: docker
    dockerfilePath: ./services/ai-agent/Dockerfile
    dockerContext: ./services/ai-agent
    plan: free             # cold starts aceptables — whatsapp responde 200 async
    healthCheckPath: /health
    envVars:
      # OpenAI
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_WHISPER_MODEL
        value: whisper-1
      - key: OPENAI_TTS_MODEL
        value: tts-1
      - key: OPENAI_TTS_VOICE
        value: alloy
      # Qdrant Cloud
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_LEGAL
        value: legal
      - key: QDRANT_COLLECTION_ODS
        value: ods
      - key: QDRANT_COLLECTION_PROCEDIMIENTOS
        value: procedimientos
      - key: QDRANT_COLLECTION_CASOS
        value: casos_exito
      # LangSmith (observabilidad)
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: participa-ai
      # Redis Cloud
      - key: REDIS_URL
        sync: false
      - key: REDIS_PASSWORD
        sync: false

  # ── 3. Scraper diario — Python / httpx + BeautifulSoup ────────────────────
  - type: cron
    name: participa-scraper
    runtime: python
    schedule: "0 13 * * *"   # 8:00 AM Lima (UTC-5)
    buildCommand: pip install -r data-pipeline/scraper/requirements.txt
    startCommand: cd data-pipeline && python scraper/run_scraper.py
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
